configs:
  prometheus_config:
    file: ./monitoring/prometheus.yml
  grafana_datasource:
    file: ./monitoring/grafana-datasource.yml

services:
  traefik:
    image: traefik:v3.6
    command:
      - "--providers.swarm=true"
      - "--providers.swarm.exposedbydefault=false"
      - "--providers.swarm.network=library_frontend"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.metrics.address=:8082"
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.entrypoint=metrics"
    ports:
      - target: 80
        published: 8080
        protocol: tcp
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - frontend
      - monitoring
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  web:
    image: ghcr.io/shumilinandrey/locallibrary:latest
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "${SITE_HOST}"
    secrets:
      - django_secret_key
      - postgres_password
    command:
      - /bin/sh
      - -ec
      - |
        export DJANGO_SECRET_KEY="$$(cat /run/secrets/django_secret_key)"
        export DATABASE_URL="postgres://library:$$(cat /run/secrets/postgres_password)@db:5432/library"
        exec gunicorn locallibrary.wsgi:application --bind 0.0.0.0:8000
    networks:
      - frontend
      - backend
    deploy:
      replicas: 2
      placement:
        constraints:
          - node.role == worker
      restart_policy:
        condition: any
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=library_frontend"
        - "traefik.http.routers.library.rule=Host(`${SITE_HOST}`)"
        - "traefik.http.routers.library.entrypoints=web"
        - "traefik.http.services.library.loadbalancer.server.port=8000"

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: library
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    volumes:
      - prometheus_data:/prometheus
    networks:
      - monitoring
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  grafana:
    image: grafana/grafana:12.1.1
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
        mode: host
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_password
    secrets:
      - grafana_password
    configs:
      - source: grafana_datasource
        target: /etc/grafana/provisioning/datasources/prometheus.yml
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

networks:
  frontend:
    driver: overlay
  backend:
    driver: overlay
  monitoring:
    driver: overlay

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

secrets:
  django_secret_key:
    external: true
  postgres_password:
    external: true
  grafana_password:
    external: true
