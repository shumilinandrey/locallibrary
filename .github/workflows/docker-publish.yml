
name: Docker Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test Django
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build test image
        run: docker build -t locallibrary:test .

      - name: Run Django checks and tests
        run: |
          docker run --rm \
            -e DJANGO_SECRET_KEY=temporary-ci-test-key \
            -e DATABASE_URL=sqlite:////tmp/ci.sqlite3 \
            locallibrary:test \
            sh -c "python manage.py check && python manage.py test catalog"

  publish:
    name: Publish Docker image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/shumilinandrey/locallibrary:latest
            ghcr.io/shumilinandrey/locallibrary:${{ github.sha }}
